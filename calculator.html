  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

    <div class="main">
<div class="calc-container">
    <div class="display" id="display">0</div>
    <div class="buttons">
        <div class="button"><i class="bi bi-backspace" onclick="cleardisplay()"></i></div>
        <div class="button"><i class="bi bi-plus-slash-minus"></i></div>
        <div class="button"  onclick="addOperand('%')"><i class="bi bi-percent"></i></div>
        <div class="button orange" onclick="addOperand('/')"> &#xF7;</div>
        <div class="button"  onclick="getNumber('7')">7</div>
        <div class="button" onclick="getNumber('8')">8</div>
        <div class="button"  onclick="getNumber('9')">9</div>
        <div class="button orange" onclick="addOperand('*')"><i class="bi bi-x" ></i></div>
        <div class="button"  onclick="getNumber('4')">4</div>
        <div class="button" onclick="getNumber('5')">5</div>
        <div class="button"  onclick="getNumber('6')">6</div>
        <div class="button orange" onclick="addOperand('-')"><i class="bi bi-dash-lg"></i></div>
        <div class="button"  onclick="getNumber('1')">1</div>
        <div class="button"  onclick="getNumber('2')">2</div>
        <div class="button"  onclick="getNumber('3')">3</div>
        <div class="button orange" onclick="addOperand('+')"><i class="bi bi-plus"></i></div>
        <div class="button" onclick="addParenthesis()">( )</i></div>
        <div class="button"  onclick="getNumber('0')">0</div>
        <div class="button"><i class="bi bi-dot"></i></div>
        <div class="button orange" onclick="calculate()">&#61;</div>
    </div>
</div>
    </div>


</body>
<script src="scripts.js"></script>
</html>
  </body>
  <script src="calculator.js"></script>
</html>
